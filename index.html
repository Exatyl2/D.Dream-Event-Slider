<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Gallery Slider</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }
    .slider {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      background-position: center top;
      background-size: cover;
      background-repeat: no-repeat;
    }
    .slide.current {
      opacity: 1;
    }

    /* --- ADD YOUR PICTURES HERE --- */
    /* Use relative file paths if images are stored in your repo (e.g., '1.jpg') */
    /* Or paste full direct web URLs (e.g., 'https://domain.com/image.jpg') */
    .slide:nth-child(1) { background-image: url("1.png"); }
    .slide:nth-child(2) { background-image: url("2.png"); }
    .slide:nth-child(3) { background-image: url("3.png"); }

    /* Button Controls */
    .buttons button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 2px solid #e5ebf3;
      background-color: rgba(0, 0, 0, 0.3);
      color: #e5ebf3;
      cursor: pointer;
      padding: 12px 15px;
      border-radius: 50%;
      outline: none;
      z-index: 10;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .buttons button#prev { left: 1rem; }
    .buttons button#next { right: 1rem; }

    .buttons button:hover {
      background-color: #e5ebf3;
      color: #362a2b;
    }
  </style>
</head>
<body>

  <div class="slider">
    <!-- To add more images, add another <div class="slide"></div> here -->
    <!-- and add a corresponding .slide:nth-child(N) rule in the CSS above -->
    <div class="slide current"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>

  <div class="buttons">
    <button id="prev"><i class="fas fa-arrow-left"></i></button>
    <button id="next"><i class="fas fa-arrow-right"></i></button>
  </div>

  <script>
    const slides = document.querySelectorAll(".slide");
    const nextButton = document.getElementById("next");
    const prevButton = document.getElementById("prev");
    const auto = true;
    const intervalTime = 5000; // Time in milliseconds per slide
    let slideInterval;

    const nextSlide = () => {
      const current = document.querySelector(".current");
      current.classList.remove("current");
      if (current.nextElementSibling) {
        current.nextElementSibling.classList.add("current");
      } else {
        slides[0].classList.add("current");
      }
    };

    const prevSlide = () => {
      const current = document.querySelector(".current");
      current.classList.remove("current");
      if (current.previousElementSibling) {
        current.previousElementSibling.classList.add("current");
      } else {
        slides[slides.length - 1].classList.add("current");
      }
    };

    nextButton.addEventListener("click", () => {
      nextSlide();
      if (auto) {
        clearInterval(slideInterval);
        slideInterval = setInterval(nextSlide, intervalTime);
      }
    });

    prevButton.addEventListener("click", () => {
      prevSlide();
      if (auto) {
        clearInterval(slideInterval);
        slideInterval = setInterval(nextSlide, intervalTime);
      }
    });

    if (auto) {
      slideInterval = setInterval(nextSlide, intervalTime);
    }
  </script>

</body>
</html>
